<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
  <meta name='theme-color' content='#0f2c4a'>
  <title>Rad2Rad | Connection required</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font: 16px/1.6 system-ui, sans-serif; background: #0f2c4a; color: #fff; }
    main { width: min(420px, 100%); text-align: center; }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { font-size: 26px; line-height: 1.25; }
    p { color: #c3d2e0; }
    button { min-height: 48px; padding: 12px 24px; border: 0; border-radius: 10px; background: #0776ff; color: #fff; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src='./pwa/icon-192.png' alt='Rad2Rad'>
    <h1>Connection required</h1>
    <p>Reconnect to use Rad2Rad. Sign-in, requests and uploads require an internet connection.</p>
    <p>No requests or uploads are queued by this app while offline.</p>
    <button type='button' onclick='window.location.reload()'>Try again</button>
  </main>
  <script>window.addEventListener('online', () => window.location.reload());</script>
</body>
</html>
